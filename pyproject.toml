[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asao-erp"
version = "0.3.0"
description = "Odoo Community from Python, through a verified command line: reads, groups, PDFs, a books review and daily/weekly/monthly routines your agent reads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]
license = "Apache-2.0"
authors = [{name = "Nguyễn Hữu Hoàng", email = "nguyenhuuhoang711@gmail.com"}]
keywords = ["odoo", "erp", "cli", "sdk", "pandas", "statistics", "accounting", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/asao-vn/asao-erp-sdk"
Repository = "https://github.com/asao-vn/asao-erp-sdk"
Issues = "https://github.com/asao-vn/asao-erp-sdk/issues"
"Command line" = "https://github.com/asao-vn/asao-odoo-tools"
Funding = "https://ko-fi.com/nguyenhuuhoang"

[project.scripts]
asao-erp = "asao_erp.__main__:main"

[project.optional-dependencies]
pandas = ["pandas>=2"]
# Kept so an install line that names it still works: tomli is a dependency on Python 3.10.
toml = ["tomli>=2; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]
